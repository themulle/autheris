worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format benchmark '$remote_addr - [$time_local] "$request" '
                         '$status $body_bytes_sent "$http_referer" '
                         '"$http_user_agent" rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log benchmark;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100000;
    types_hash_max_size 2048;

    upstream gqlgateway_upstream {
        server gqlgateway-api:5050;
        keepalive 128;
    }

    # Map simulated client role header to ForwardAuth identity headers
    map $http_x_benchmark_role $fwd_user {
        "Auditor"    "user_auditor";
        "Manager"    "user_manager";
        "Finance"    "user_finance";
        "Admin"      "admin";
        "Blocked"    "user_blocked";
        "Anonymous"  "";
        default      "user_finance";
    }

    map $http_x_benchmark_role $fwd_roles {
        "Auditor"    "FinanceAuditor";
        "Manager"    "FinanceManager";
        "Finance"    "FinanceUser";
        "Admin"      "GovernanceAdmin";
        "Blocked"    "BlockedRole";
        "Anonymous"  "";
        default      "FinanceUser";
    }

    map $http_x_benchmark_role $fwd_groups {
        "Auditor"    "S-1-5-21-GROUP-AUDIT,S-1-5-21-GROUP-FINANCE";
        "Manager"    "S-1-5-21-GROUP-FINANCE";
        "Finance"    "S-1-5-21-GROUP-FINANCE";
        "Admin"      "S-1-5-21-GROUP-ADMIN";
        "Blocked"    "S-1-5-21-GROUP-BLOCKED";
        "Anonymous"  "";
        default      "S-1-5-21-GROUP-FINANCE";
    }

    map $http_x_benchmark_role $fwd_email {
        "Auditor"    "auditor@corp.local";
        "Manager"    "manager@corp.local";
        "Finance"    "finance@corp.local";
        "Admin"      "admin@corp.local";
        "Blocked"    "blocked@corp.local";
        "Anonymous"  "";
        default      "finance@corp.local";
    }

    server {
        listen 8080 backlog=8192;
        server_name _;

        client_max_body_size 10m;
        client_body_buffer_size 1m;

        # Healthcheck endpoint for proxy
        location /health/live {
            proxy_pass http://gqlgateway_upstream/health/live;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /health/ready {
            proxy_pass http://gqlgateway_upstream/health/ready;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /metrics {
            proxy_pass http://gqlgateway_upstream/metrics;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Main GraphQL and API reverse proxy with ForwardAuth contract
        location / {
            proxy_pass http://gqlgateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Standard Forwarded Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # Anti-CSRF header required by GqlGateway pipeline
            proxy_set_header GraphQL-Preflight "1";

            # ForwardAuth Security Contract:
            # 1. Cryptographic Shared Secret between trusted proxy and Gateway
            proxy_set_header X-Forwarded-Secret "bench-shared-secret-auth-key-2026";

            # 2. Injected ForwardAuth User Context (overrideable by direct headers if provided)
            proxy_set_header X-Forwarded-User $fwd_user;
            proxy_set_header X-Forwarded-Roles $fwd_roles;
            proxy_set_header X-Forwarded-Groups $fwd_groups;
            proxy_set_header X-Forwarded-Email $fwd_email;
            proxy_set_header X-Forwarded-Tenant "";
            proxy_set_header x-autheris-principal "";
            proxy_set_header x-autheris-tenant "";
            proxy_set_header x-autheris-roles "";
            proxy_set_header x-autheris-rls-filter "";

            # Buffering and timeouts optimized for latency benchmarks
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 32k;
            proxy_busy_buffers_size 64k;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 10s;
        }
    }
}
