# Production HA values for Autheris Enterprise GraphQL Gateway.

replicaCount: 3

resources:
  limits:
    cpu: 4000m
    memory: 4096Mi
  requests:
    cpu: 1000m
    memory: 1024Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  minAvailable: 2

topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: DoNotSchedule

terminationGracePeriodSeconds: 75

gateway:
  drainDelaySeconds: 10
  shutdownTimeoutSeconds: 45
  aspnetcoreEnvironment: "Production"
  redis:
    enabled: true
    instanceName: "AutherisProd:"
