# Production HA values for Autheris Enterprise GraphQL Gateway.

replicaCount: 3

image:
  pullPolicy: IfNotPresent
  # Production must pin an immutable digest: --set image.digest=sha256:<digest>
  digest: ""
  requireDigest: true

serviceAccount:
  automountServiceAccountToken: false

monitoring:
  serviceMonitor:
    # Production must scrape /metrics with credentials; helm template fails when auth.type is "none".
    requireAuth: true
    auth:
      type: bearer

networkPolicy:
  enabled: true
  ingress:
    from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: traefik   # PLACEHOLDER: ingress controller namespace
  metrics:
    from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: monitoring   # PLACEHOLDER: Prometheus namespace
  egress:
    allowAll: false
    # PLACEHOLDERS: replace CIDRs/ports with the real governance DB, Redis, IdP and Key Vault endpoints.
    rules:
      - to:                      # Governance database (PostgreSQL)
          - ipBlock:
              cidr: 10.0.10.0/24
        ports:
          - protocol: TCP
            port: 5432
      - to:                      # Redis
          - ipBlock:
              cidr: 10.0.11.0/24
        ports:
          - protocol: TCP
            port: 6379
      - to:                      # IdP / Key Vault (HTTPS)
          - ipBlock:
              cidr: 10.0.12.0/24
        ports:
          - protocol: TCP
            port: 443

resources:
  limits:
    cpu: 4000m
    memory: 4096Mi
  requests:
    cpu: 1000m
    memory: 1024Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  minAvailable: 2

topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: DoNotSchedule

terminationGracePeriodSeconds: 75

gateway:
  # SEC2-09: render fails until exactly one authentication provider is configured (and, for forwardAuth, trustedProxies).
  production:
    enforceRequiredSettings: true
  # Enable exactly one provider and fill its fields, e.g.
  #   --set gateway.authentication.entraId.enabled=true --set gateway.authentication.entraId.tenantId=... (clientId, audience)
  dataSources:
    requireTenantColumn: true
  drainDelaySeconds: 10
  shutdownTimeoutSeconds: 45
  aspnetcoreEnvironment: "Production"
  redis:
    enabled: true
    instanceName: "AutherisProd:"
