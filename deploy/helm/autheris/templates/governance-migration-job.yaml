{{- if .Values.governanceMigrationJob.enabled }}
{{- $governanceSecret := .Values.gateway.governanceDb.existingSecret | default "" | toString | trim }}
{{- if not $governanceSecret }}
{{- fail "gateway.governanceDb.existingSecret is required (secret holding the governance connection string)" -}}
{{- end }}
{{- $govKey := .Values.gateway.governanceDb.connectionStringSecretKey | default "" | toString | trim }}
{{- if not $govKey }}
{{- fail "gateway.governanceDb.connectionStringSecretKey is required when governanceMigrationJob is enabled" -}}
{{- end }}
{{- $migSecretRaw := .Values.governanceMigrationJob.existingSecret | default "" | toString | trim }}
{{- $migSecret := default $governanceSecret $migSecretRaw }}
{{- $migKey := .Values.governanceMigrationJob.migrationConnectionStringSecretKey | default "" | toString | trim }}
{{- if or (not $migKey) (and (eq $migSecret $governanceSecret) (eq $migKey $govKey)) }}
{{- fail "governanceMigrationJob.migrationConnectionStringSecretKey must reference DDL migration credentials separate from gateway.governanceDb.connectionStringSecretKey" -}}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "autheris.fullname" . }}-migrate
  labels:
    {{- include "autheris.migrationLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
data:
  {{- include "autheris.configData" . | nindent 2 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "autheris.fullname" . }}-migrate
  labels:
    {{- include "autheris.migrationLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.governanceMigrationJob.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.governanceMigrationJob.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.governanceMigrationJob.ttlSecondsAfterFinished }}
  template:
    metadata:
      {{- with .Values.governanceMigrationJob.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- with .Values.governanceMigrationJob.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- include "autheris.migrationLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.governanceMigrationJob.serviceAccountName }}
      serviceAccountName: {{ . | quote }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: governance-migration
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "autheris.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--migrate-governance"]
          env:
            {{- include "autheris.gatewayEnv" . | nindent 12 }}
            - name: Gateway__GovernanceDb__Migrations__Mode
              value: "Apply"
            - name: Gateway__GovernanceDb__MigrationConnectionString
              valueFrom:
                secretKeyRef:
                  name: {{ $migSecret }}
                  key: {{ $migKey }}
          envFrom:
            - configMapRef:
                name: {{ include "autheris.fullname" . }}-migrate
          {{- with .Values.governanceMigrationJob.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          {{- if .Values.tmpVolume.sizeLimit }}
          emptyDir:
            sizeLimit: {{ .Values.tmpVolume.sizeLimit | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
