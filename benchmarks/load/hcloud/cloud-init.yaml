#cloud-config
# Hetzner Cloud Init Configuration for GraphQL Benchmark Host
# OS: Ubuntu 24.04 LTS (Noble)

package_update: true
package_upgrade: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - git
  - htop
  - iotop
  - sysstat
  - jq
  - unzip
  - build-essential

write_files:
  # 1. High Performance Kernel / Network Tuning for Benchmarking
  - path: /etc/sysctl.d/99-benchmark.conf
    permissions: '0644'
    content: |
      # File descriptors
      fs.file-max = 2097152
      fs.inotify.max_user_instances = 8192
      fs.inotify.max_user_watches = 524288

      # TCP Socket backlog & buffer sizes
      net.core.somaxconn = 65535
      net.ipv4.tcp_max_syn_backlog = 65535
      net.core.netdev_max_backlog = 100000

      # Ephemeral port range
      net.ipv4.ip_local_port_range = 1024 65535

      # TCP connection reuse and recycling
      net.ipv4.tcp_tw_reuse = 1
      net.ipv4.tcp_fin_timeout = 15

      # TCP window scaling and memory limits
      net.ipv4.tcp_window_scaling = 1
      net.ipv4.tcp_max_tw_buckets = 1440000
      net.core.rmem_max = 16777216
      net.core.wmem_max = 16777216
      net.ipv4.tcp_rmem = 4096 87380 16777216
      net.ipv4.tcp_wmem = 4096 65536 16777216

  # 2. Process limits
  - path: /etc/security/limits.d/99-nofile.conf
    permissions: '0644'
    content: |
      * soft nofile 1048576
      * hard nofile 1048576
      root soft nofile 1048576
      root hard nofile 1048576

runcmd:
  # Apply sysctl settings
  - sysctl --system

  # Install Docker CE
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

  # Install Node.js 20 LTS
  - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
  - apt-get install -y nodejs
  - npm install -g yarn autocannon

  # Install k6 (official grafana repo)
  - curl -fsSL https://dl.k6.io/key.gpg | gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
  - echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | tee /etc/apt/sources.list.d/k6.list
  - apt-get update
  - apt-get install -y k6

  # Install .NET 10 SDK
  - curl -sSL https://dot.net/v1/dotnet-install.sh | bash /dev/stdin --channel 10.0 --install-dir /usr/share/dotnet
  - ln -s /usr/share/dotnet/dotnet /usr/bin/dotnet

  # Create benchmark working directory
  - mkdir -p /opt/benchmarks
