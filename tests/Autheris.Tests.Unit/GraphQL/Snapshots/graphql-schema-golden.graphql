schema {
  query: Query
  mutation: Mutation
}

type AffectedEntity {
  cyclicReferenceDetected: Boolean!
  id: String!
  name: String!
  ownerEmail: String
  ownerTeam: String
  type: LineageNodeType!
}

type CallingApplicationUsage {
  actorSids: [String!]
  application: String!
  calls: Long!
  day: String!
  distinctActors: Int!
  queryNames: [String!]!
  rejections: RejectionBreakdown!
  rowsMeasuredCalls: Long!
  rowsReturned: Long!
  versions: [String!]!
}

type ConsentDto {
  columns: [String!]!
  description: String
  effect: String!
  granteeSid: String
  granteeType: String!
  id: UUID!
  roleName: String
  tableIdentifier: String!
  validFrom: DateTime!
  validTo: DateTime!
}

type ConsentRequestDto {
  businessJustification: String
  contextJson: String
  id: UUID!
  itsmTicketId: String
  requestedAt: DateTime!
  requestedGranteeRef: String
  requestedGranteeType: String!
  requestedValidTo: DateTime
  requesterSid: String!
  status: String!
  tableId: UUID!
  tableIdentifier: String!
}

type ConsentRequestPayload {
  description: String
  message: String!
  requestId: UUID!
  status: String!
}

type ConsentRevocationImpactReport {
  affectedDownstreamCount: Int!
  affectedEntities: [AffectedEntity!]!
  containsCycles: Boolean!
  severity: String!
}

type DataCatalogSyncPayload {
  art9ProtectedTablesCount: Int!
  maskedColumnsCount: Int!
  success: Boolean!
  syncedColumnsCount: Int!
  syncedTablesCount: Int!
  warnings: [String!]!
}

type DownstreamConsumerEntity {
  distanceFromRoot: Int!
  id: String!
  name: String!
  ownerEmail: String
  ownerTeam: String
  type: LineageNodeType!
  upstreamDependencyId: String
}

type EffectiveTableAccessDto {
  activeRowFilters: [String!]!
  allowedColumns: [String!]!
  consentDescription: String
  consentDescriptionOrigin: String!
  consentDescriptions: [String!]!
  decision: String!
  deniedColumns: [String!]!
  maskedColumns: [String!]!
  restrictedScope: Boolean!
  scopeClearRequiredColumns: [String!]
  table: String!
  validTo: DateTime
}

type GdprDisclosureReport {
  disclosedRecipients: [GdprRecipientAccessRecord!]!
  evidenceLevel: String!
  generatedAt: DateTime!
  incompletenessReasons: [String!]
  isComplete: Boolean!
  legalBasisNotice: String!
  sensitivityCategories: [String!]!
  subjectSid: String
  targetTable: String
  timeWindowDays: Int!
  totalAccessEvents: Int!
}

type GdprRecipientAccessRecord {
  accessedColumns: [String!]!
  firstAccess: DateTime!
  lastAccess: DateTime!
  maskingRuleApplied: String
  purpose: String!
  recipientCategory: String!
  recipientSid: String!
  totalQueries: Int!
}

type Mutation {
  approveConsentRequest(
    columnMasking: ColumnMaskingInput
    description: String
    idempotencyKey: String
    requestId: UUID!
    rowFilter: RowFilterInput
  ): ConsentRequestPayload! @cost(weight: "10")
  rejectConsentRequest(
    idempotencyKey: String
    reason: String!
    requestId: UUID!
  ): ConsentRequestPayload! @cost(weight: "10")
  reloadSchema: Boolean! @cost(weight: "10")
  requestTableAccess(
    context: AccessRequestContextInput
    domain: String!
    durationDays: Int!
    idempotencyKey: String
    justification: String!
    schema: String!
    tableName: String!
  ): ConsentRequestPayload! @cost(weight: "10")
  revokeConsent(consentId: UUID!, reason: String!): Boolean! @cost(weight: "10")
  setConsentDescription(consentId: UUID!, description: String): ConsentDto!
    @cost(weight: "10")
  syncDataCatalog(dryRun: Boolean! = false): DataCatalogSyncPayload!
    @cost(weight: "10")
  syncOpenMetadata(dryRun: Boolean! = false): OpenMetadataSyncPayload!
    @cost(weight: "10")
  withdrawAccessRequest(requestId: UUID!): ConsentRequestPayload!
    @cost(weight: "10")
}

type OpenMetadataSyncPayload {
  success: Boolean!
  syncedConsents: Int!
  syncedMaskingRules: Int!
  syncedTables: Int!
  warnings: [String!]!
}

type Query {
  calculateConsentRevocationImpact(consentId: UUID!): ConsentRevocationImpactReport!
    @cost(weight: "10")
  catalog(
    after: Int
    domain: String
    first: Int
    language: String
    search: String
    tag: String
  ): [TableMetadataDto!]! @cost(weight: "10")
  exportGdprDataDisclosureReportPdfBase64(
    domain: String
    schema: String
    subjectSid: String
    tableName: String
    timeWindowDays: Int! = 365
  ): String! @cost(weight: "10")
  gdprDataDisclosureReport(
    domain: String
    schema: String
    subjectSid: String
    tableName: String
    timeWindowDays: Int! = 365
  ): GdprDisclosureReport! @cost(weight: "10")
  myAccess(table: String!): EffectiveTableAccessDto! @cost(weight: "10")
  myAccessRequests(after: Int, first: Int, status: String): [ConsentRequestDto!]!
    @cost(weight: "10")
  myActiveConsents(after: Int, first: Int, table: String): [ConsentDto!]!
    @cost(weight: "10")
  pendingApprovalsForMe(after: Int, first: Int): [ConsentRequestDto!]!
    @cost(weight: "10")
  table(
    after: Int! = 0
    domain: String!
    first: Int! = 50
    name: String!
    schema: String! = "dbo"
  ): TableRecordPayload! @cost(weight: "10")
  tableConsumers(
    domain: String!
    schema: String!
    tableName: String!
    timeWindowDays: Int! = 30
  ): TableConsumersReport! @cost(weight: "10")
}

type RejectionBreakdown {
  access: Long!
  cost: Long!
  other: Long!
  rateLimit: Long!
  total: Long!
}

type RuntimeConsumerSummary {
  actorSid: String!
  clientType: String!
  firstSeenAt: DateTime!
  lastSeenAt: DateTime!
  queryCount: Int!
}

type TableConsumersReport {
  activeReadersCount: Int!
  applicationUsages: [CallingApplicationUsage!]
  breakingChangeRisk: String!
  downstreamConsumers: [DownstreamConsumerEntity!]!
  lastAccessedAt: DateTime
  recommendedMitigations: [String!]!
  runtimeConsumers: [RuntimeConsumerSummary!]!
  suppressedSmallGroups: Boolean!
  table: String!
  totalDownstreamCount: Int!
}

type TableMetadataDto {
  accessStatus: String
  columns: [String!]!
  dataOwner: String
  delegates: [String!]
  description: String
  displayName: String!
  domain: String!
  language: String
  schema: String!
  sensitivity: String!
  tableName: String!
  tags: [String!]!
}

type TableRecordPayload {
  jsonRows: [String!]!
  tableName: String!
  totalCount: Int!
}

input AccessRequestContextInput {
  application: String
  expectedDuration: String
  justification: String
  tool: String
}

input ColumnMaskingInput {
  rules: [ColumnMaskRuleInput!]
}

input ColumnMaskRuleInput {
  columnName: String!
  maskingLevel: ColumnAccessLevel!
  maskingType: String
}

input RowFilterInput {
  filterGroup: String
  predicates: [RowFilterPredicateInput!]
  rowFilterSql: String
}

input RowFilterPredicateInput {
  columnName: String!
  operator: String!
  value: String
  valueJson: String
  values: [String!]
  valueType: String
}

enum ColumnAccessLevel {
  CLEAR
  DENY
  MASK
}

enum LineageNodeType {
  COLUMN
  DASHBOARD
  EXTERNAL_SERVICE
  PIPELINE
  TABLE
}

"The `DateTime` scalar type represents a date and time with time zone offset information."
scalar DateTime
  @specifiedBy(url: "https://scalars.graphql.org/chillicream/date-time.html")

"The `Long` scalar type represents a signed 64-bit integer."
scalar Long
  @specifiedBy(url: "https://scalars.graphql.org/chillicream/long.html")

"The `UUID` scalar type represents a Universally Unique Identifier (UUID) as defined by RFC 9562."
scalar UUID
  @specifiedBy(url: "https://scalars.graphql.org/chillicream/uuid.html")

"The purpose of the `cost` directive is to define a `weight` for GraphQL types, fields, and arguments. Static analysis can use these weights when calculating the overall cost of a query or response."
directive @cost(
  "The `weight` argument defines what value to add to the overall cost for every appearance, or possible appearance, of a type, field, argument, etc."
  weight: String!
) on
  | SCALAR
  | OBJECT
  | FIELD_DEFINITION
  | ARGUMENT_DEFINITION
  | ENUM
  | INPUT_FIELD_DEFINITION