# ==============================================================================
# Autheris - Base Compose (Production mode)
#
# SEC C-04: Starts the gateway in Production mode with all security checks
# active. Startup fails closed unless required production configuration is set
# (e.g. Gateway__DataMasking__HmacSecretKeyVaultRef, IdP/Audience, AllowedHosts).
# Keep the pinned release image digest updated via releases / Dependabot.
#
# Local evaluation ("Getting Started", insecure dev defaults, demo data):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ==============================================================================
services:
  gql-gateway:
    image: ghcr.io/themulle/autheris:1.10.6@sha256:aaa2de631356f59fe161b02b49a171f022778e05475f55683793fda2feba5d1d
    container_name: gql-gateway
    user: "10001:10001"
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    pids_limit: 512
    mem_limit: 2g
    cpus: 2
    ports:
      # Loopback only. Publish on other interfaces only behind a TLS-terminating, authenticating proxy.
      - "127.0.0.1:8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      # SR-L-02: required outside Development. Add the public host name when published behind a proxy.
      - Gateway__Hosting__AllowedHosts__0=localhost
      - Gateway__Hosting__AllowedHosts__1=127.0.0.1
      - Gateway__State__StateDirectory=/app/data
      - Gateway__GovernanceDb__ConnectionString=Data Source=/app/data/governance.db
    volumes:
      - autheris-data:/app/data
    healthcheck:
      test: ["CMD", "dotnet", "Autheris.Api.dll", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  autheris-data:
