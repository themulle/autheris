# ==============================================================================
# Autheris - Basis-Compose (PRODUCTION)
#
# SEC C-04: Diese Datei startet den Gateway in der Production-Umgebung. Dort sind
# alle Sicherheitsprüfungen aktiv; der Start bricht ab, solange Pflicht-Konfiguration
# fehlt (z.B. Gateway__DataMasking__HmacSecretKeyVaultRef, IdP/Audience, Origins).
#
# Lokales Ausprobieren ("Getting Started", unsichere Dev-Defaults, Demo-Daten):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ==============================================================================
services:
  gql-gateway:
    image: ghcr.io/themulle/autheris:getting-started@sha256:222759b391a1aaf241166672c8f99b2d4ada452e7b5319f3c6e8f265a37b5ad4
    container_name: gql-gateway
    user: "10001:10001"
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    pids_limit: 512
    mem_limit: 1g
    cpus: 2
    ports:
      # Loopback only. Publish on other interfaces only behind a TLS-terminating, authenticating proxy.
      - "127.0.0.1:8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      # Integrierter Microsoft Garnet .NET L2-Cache
      - Gateway__Caching__Garnet__EnableEmbeddedServer=true
      - Gateway__GovernanceDb__ConnectionString=Data Source=/app/data/governance.db;Cache=Shared
    volumes:
      - autheris-data:/app/data
    healthcheck:
      test: ["CMD", "dotnet", "Autheris.Api.dll", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  autheris-data:
