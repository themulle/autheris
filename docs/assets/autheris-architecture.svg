    <text x="14" y="252" font-size="12" font-weight="600" fill="#c084fc">Distributed Clustering (Redis)</text>
    <text x="14" y="272" font-size="10" fill="#c9d1d9">• Redis Pub/Sub Policy Epoch Bus</text>
    <text x="14" y="288" font-size="10" fill="#c9d1d9">• Atomic Token-Bucket Rate Limiter</text>
    <text x="14" y="304" font-size="10" fill="#c9d1d9">• Lock-free In-Memory Interlocked Fallback</text>
    <text x="14" y="320" font-size="10" fill="#c9d1d9">• Deep K8s Readiness &amp; Liveness Probes</text>
