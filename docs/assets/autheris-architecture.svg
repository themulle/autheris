    <text x="15" y="205" font-size="10" fill="#a5b4fc">AstSimplificationVisitor: Constant Folding &amp; Tautology Reduction</text>
    <text x="15" y="221" font-size="10" fill="#a5b4fc">Target Dialects: PostgreSQL, SQL Server (T-SQL), SQLite</text>

    <!-- Stage 4 -->
