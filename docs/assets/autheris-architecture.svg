    <text x="528" y="22" font-size="12" font-weight="600" fill="#f0f6fc">Declarative SQL-to-API &amp; REST</text>
    <text x="528" y="38" font-size="10" fill="#8b949e">Dynamic OpenAPI 3.1 • Swagger UI</text>

    <!-- Box 4: WebSQL & Procedures -->
