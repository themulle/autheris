    <text x="271" y="22" font-size="12" font-weight="600" fill="#f0f6fc">Agentic AI (MCP Gateway)</text>
    <text x="271" y="38" font-size="10" fill="#8b949e">Stdio / SSE • OWASP LLM01 Guardrails</text>

    <!-- Box 3: SQL-to-API -->
