    <text x="14" y="152" font-size="10" fill="#c9d1d9">• Purview, Collibra, Alation &amp; OpenMetadata</text>
    <text x="14" y="168" font-size="10" fill="#c9d1d9">• Automated GDPR Art. 9 Classification</text>
    <text x="14" y="184" font-size="10" fill="#c9d1d9">• OpenLineage &amp; OpenJEV Event Export</text>
    <text x="14" y="200" font-size="10" fill="#c9d1d9">• Backstage Software Catalog Export</text>

    <!-- Item 3: Clustering -->
