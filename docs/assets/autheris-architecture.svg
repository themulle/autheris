    <text x="528" y="58" font-size="10" fill="#8b949e">• Hot Chocolate Fusion Supergraph</text>
    <text x="528" y="74" font-size="10" fill="#8b949e">• Isolated C# Plugins (AssemblyLoadContext)</text>
    <text x="528" y="90" font-size="10" fill="#8b949e">• Anti-SSRF DNS Pre-Resolution Defense</text>
    <text x="528" y="106" font-size="10" fill="#8b949e">• Adaptive Request Batching</text>

    <!-- Store 4: Streams & CDC -->
