  <rect x="50" y="74" width="1060" height="46" rx="8" fill="#111827" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4 2"/>
  <text x="68" y="101" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="1">PROTOCOLS &amp; FORMATS:</text>

  <g transform="translate(230, 83)">
