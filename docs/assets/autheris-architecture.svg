    <text x="271" y="42" font-size="10" fill="#8b949e">• Apache Iceberg v2 Tables</text>
    <text x="271" y="58" font-size="10" fill="#8b949e">• Amazon S3 (SigV4 Authentication)</text>
    <text x="271" y="74" font-size="10" fill="#8b949e">• Azure Blob Storage &amp; Local Filesystem</text>
    <text x="271" y="90" font-size="10" fill="#8b949e">• Vectorized Partition Pruning</text>
    <text x="271" y="106" font-size="10" fill="#8b949e">• Min/Max Column Stats Filtering</text>

    <!-- Store 3: REST & Fusion -->
