    <text x="15" y="303" font-size="10" fill="#a5b4fc">Zero-Allocation Data Masking (HMAC-SHA256 / Redaction)</text>
    <text x="15" y="319" font-size="10" fill="#a5b4fc">Side-Channel Defense (Rejection of Mask/Deny WHERE Filters)</text>
  </g>

