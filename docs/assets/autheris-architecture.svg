    <text x="14" y="304" font-size="10" fill="#c9d1d9">• GDPR Art. 15 Subject Access Disclosure</text>
    <text x="14" y="320" font-size="10" fill="#c9d1d9">• Zero-Privilege Declared Procs (DDL Hash)</text>
