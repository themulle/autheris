  <text x="580" y="58" text-anchor="middle" font-size="12" fill="#94a3b8" letter-spacing="0.5">.NET 10 • Hot Chocolate 16 • ANTLR4 Trino Engine • Zero-Trust Data-Owner-Consent Gateway</text>

