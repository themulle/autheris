    <text x="15" y="127" font-size="10" fill="#a5b4fc">Fail-Closed Verification for Tables, Columns &amp; Rows</text>

    <!-- Stage 3 -->
    <rect y="146" width="360" height="88" rx="6" fill="#161b22" stroke="#4338ca"/>
    <text x="15" y="169" font-size="12" font-weight="600" fill="#e0e7ff">3. Trino-Compatible AST Target Compiler</text>
