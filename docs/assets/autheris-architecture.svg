    <text x="332" y="17" text-anchor="middle" font-size="10" font-weight="600" fill="#f0f6fc">Parquet Egress</text>

    <!-- Badge 4: WS & SSE -->
    <rect x="405" width="135" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="472" y="17" text-anchor="middle" font-size="10" font-weight="600" fill="#f0f6fc">WebSocket &amp; SSE</text>

    <!-- Badge 5: MCP Stdio -->
    <rect x="550" width="145" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="622" y="17" text-anchor="middle" font-size="10" font-weight="600" fill="#f0f6fc">MCP Stdio / Stream</text>

    <!-- Badge 6: OData v4 -->
