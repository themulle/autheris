schema {
  query: Query
  mutation: Mutation
}

type Query {
  "Execute a generic query against any cataloged table, subject to resolved Data-Owner-Consent"
  genericTable(catalogName: String!, schemaName: String!, tableName: String!): [Any]

  "Sample Finance domain records with automatic column masking and row filtering"
  financeRecords: [FinanceRecord!]!

  "Finance domain queries supporting selective nested relationships"
  finance: FinanceQuery!

  "Sample HR domain records with salary redaction and PII masking"
  hrEmployees: [HrEmployee!]!

  "List all registered tables and their current policy epochs in the governance catalog"
  catalogTables: [Table!]!

  "Fetch active consents for a specific Windows User SID or Group SID"
  consentsForUser(userSid: String!): [Consent!]!

  "List pending consent requests awaiting Data Owner approval"
  pendingRequests: [ConsentRequest!]!
}

type Mutation {
  "Submit a new consent request to access a specific table"
  requestConsent(
    catalogName: String!
    schemaName: String!
    tableName: String!
    userSid: String!
    groupSids: [String!]
    requestedColumns: [String!]
    justification: String!
    validDays: Int = 30
  ): ConsentRequest!

  "Approve a pending consent request (Data Owner authorization)"
  approveConsentRequest(
    requestId: String!
    approverSid: String!
  ): Consent!

  "Reject a pending consent request"
  rejectConsentRequest(
    requestId: String!
    approverSid: String!
    reason: String!
  ): Boolean!

  "Immediately revoke an active consent and invalidate distributed caches"
  revokeConsent(
    consentId: String!
    reason: String!
  ): Boolean!

  "Force reload of governance catalog schemas and policy epochs"
  reloadSchema: Boolean!
}

type FinanceRecord {
  transactionId: String!
  amount: Float!
  vendor: String!
  email: String
  iban: String
}

type HrEmployee {
  employeeId: String!
  firstName: String!
  lastName: String!
  salary: Float!
  ssn: String
}

type Table {
  id: String!
  catalogName: String!
  schemaName: String!
  tableName: String!
  description: String
  policyEpoch: Int!
}

type Consent {
  id: String!
  granteeSid: String!
  granteeType: String!
  tableId: String!
  effect: String!
  validFrom: String!
  validTo: String!
  status: String!
}

type ConsentRequest {
  id: String!
  requesterSid: String!
  granteeSid: String!
  granteeType: String!
  tableId: String!
  status: String!
  justification: String!
  createdAt: String!
}

type FinanceQuery {
  "Fetch flat invoices"
  invoices(first: Int = 50, after: Int = 0): TableRecordPayload!

  "Fetch invoices with nested child items resolved via Batch DataLoader"
  invoicesWithItems(first: Int = 10): [InvoiceRecord!]!
}

type InvoiceRecord {
  id: String!
  amount: Float!
  vendor: String!
  email: String
  items: [InvoiceItemRecord!]
}

type InvoiceItemRecord {
  id: String!
  invoiceId: String!
  productName: String!
  price: Float!
  sensitiveNote: String
}

type TableRecordPayload {
  tableName: String!
  totalCount: Int!
  jsonRows: [String!]!
}

scalar Any
