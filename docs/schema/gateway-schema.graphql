schema {
  query: Query
  mutation: Mutation
}

type Query {
  "Execute a generic query against any cataloged table, subject to resolved Data-Owner-Consent"
  genericTable(catalogName: String!, schemaName: String!, tableName: String!): [Any]

  "List all registered tables and their current policy epochs in the governance catalog"
  catalogTables: [Table!]!

  "Fetch active consents for a specific Windows User SID or Group SID"
  consentsForUser(userSid: String!): [Consent!]!

  "List pending consent requests awaiting Data Owner approval"
  pendingRequests: [ConsentRequest!]!
}

type Mutation {
  "Submit a new consent request to access a specific table"
  requestConsent(
    catalogName: String!
    schemaName: String!
    tableName: String!
    userSid: String!
    groupSids: [String!]
    requestedColumns: [String!]
    justification: String!
    validDays: Int = 30
  ): ConsentRequest!

  "Approve a pending consent request (Data Owner authorization)"
  approveConsentRequest(
    requestId: String!
    approverSid: String!
  ): Consent!

  "Reject a pending consent request"
  rejectConsentRequest(
    requestId: String!
    approverSid: String!
    reason: String!
  ): Boolean!

  "Immediately revoke an active consent and invalidate distributed caches"
  revokeConsent(
    consentId: String!
    reason: String!
  ): Boolean!

  "Force reload of governance catalog schemas and policy epochs"
  reloadSchema: Boolean!
}

type Table {
  id: String!
  catalogName: String!
  schemaName: String!
  tableName: String!
  description: String
  policyEpoch: Int!
}

type Consent {
  id: String!
  granteeSid: String!
  granteeType: String!
  tableId: String!
  effect: String!
  validFrom: String!
  validTo: String!
  status: String!
}

type ConsentRequest {
  id: String!
  requesterSid: String!
  granteeSid: String!
  granteeType: String!
  tableId: String!
  status: String!
  justification: String!
  createdAt: String!
}

type TableRecordPayload {
  tableName: String!
  totalCount: Int!
  jsonRows: [String!]!
}

scalar Any
