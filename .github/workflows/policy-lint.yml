name: Casbin Policy Lint & CI Gate

on:
  pull_request:
    paths:
      - '**/*.conf'
      - '**/*.csv'
      - 'tools/casbin-policy-lint/**'
  push:
    branches: [ main ]

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Run Casbin Policy Linter
        run: dotnet run --project tools/casbin-policy-lint/casbin-policy-lint.csproj -- .
