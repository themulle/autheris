name: Casbin Policy Lint & CI Gate

on:
  pull_request:
    paths:
      - '**/*.conf'
      - '**/*.csv'
      - 'tools/casbin-policy-lint/**'
  push:
    branches: [ main ]

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Run Casbin Policy Linter
        run: dotnet run --project tools/casbin-policy-lint/casbin-policy-lint.csproj -- .
