name: Casbin Policy Lint & CI Gate

on:
  pull_request:
    paths:
      - '**/*.conf'
      - '**/*.csv'
      - 'tools/casbin-policy-lint/**'
  push:
    branches: [ main ]

permissions: {}

# A new push to a pull request cancels its superseded run; pushes to main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Run Casbin Policy Linter
        run: dotnet run --project tools/casbin-policy-lint/casbin-policy-lint.csproj -- .
