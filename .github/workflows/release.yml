name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (z. B. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build and Package Binaries
        run: |
          mkdir -p dist
          mkdir -p artifacts

          # Targets: RID:ArchiveType:BinaryName
          TARGETS=(
            "linux-x64:tar:Autheris.Api"
            "linux-arm64:tar:Autheris.Api"
            "win-x64:zip:Autheris.Api.exe"
            "osx-arm64:tar:Autheris.Api"
          )

          for TARGET in "${TARGETS[@]}"; do
            IFS=":" read -r RID ARCHIVE BINARY <<< "$TARGET"
            echo "==> Building for $RID..."
            OUT_DIR="dist/$RID"

            dotnet publish src/Autheris.Api/Autheris.Api.csproj \
              -c Release \
              -r "$RID" \
              --self-contained true \
              -p:PublishSingleFile=true \
              -o "$OUT_DIR"

            ARCHIVE_NAME="Autheris-${RID}"
            if [ "$ARCHIVE" = "zip" ]; then
              (cd "$OUT_DIR" && zip -r "../../artifacts/${ARCHIVE_NAME}.zip" .)
            else
              tar -czvf "artifacts/${ARCHIVE_NAME}.tar.gz" -C "$OUT_DIR" .
            fi
          done

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
