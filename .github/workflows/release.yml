name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (z. B. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions: {}

jobs:
  build:
    name: Build, Attest & Sign Release Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Error: '$RELEASE_TAG' is not a release tag" >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # MISC-02: build exactly the tagged commit, never the dispatching branch head.
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore with Locked Mode
        run: dotnet restore Autheris.sln --locked-mode

      - name: Vulnerable Package Audit
        run: |
          dotnet list Autheris.sln package --vulnerable --include-transitive --format json --output-version 1 > vulnerable.json
          jq -e '[.projects[].frameworks[]? | (.topLevelPackages // []) + (.transitivePackages // []) | .[]] | length == 0' vulnerable.json \
            || { echo "::error::Vulnerable NuGet packages detected"; jq . vulnerable.json; exit 1; }

      # CR-ADG-11: with CI=true the Spark proxy tests fail without the pinned image (AstCompilerDatabricksSparkExecutionTests.Image).
      - name: Pull pinned Spark proxy image
        run: docker pull apache/spark:4.0.0-python3@sha256:9e2f63442ba1a672ea70d780d56da28f42ce515d0be18840569a3054cc6d2314

      - name: Run Test Suite
        run: dotnet test Autheris.sln -c Release --no-restore -p:AutherisIncludeTestAuth=true --filter "Category!=Spark&Category!=NightlyGate&Category!=Metamorphic&Category!=Fuzz&Category!=Mutant&FullyQualifiedName!~Autheris.Tests.Integration." --verbosity normal

      - name: Build and Package Binaries
        run: |
          mkdir -p dist
          mkdir -p artifacts

          TARGETS=(
            "linux-x64:tar:Autheris.Api"
            "linux-arm64:tar:Autheris.Api"
            "win-x64:zip:Autheris.Api.exe"
            "osx-arm64:tar:Autheris.Api"
          )

          for TARGET in "${TARGETS[@]}"; do
            IFS=":" read -r RID ARCHIVE BINARY <<< "$TARGET"
            echo "==> Building for $RID..."
            OUT_DIR="dist/$RID"

            dotnet publish src/Autheris.Api/Autheris.Api.csproj \
              -c Release \
              -r "$RID" \
              --self-contained true \
              -p:PublishSingleFile=true \
              -p:AutherisIncludeTestAuth=false \
              -o "$OUT_DIR"

            # Single-file bundles embed the assembly, so scan the per-RID compiled assembly (SC-04).
            mapfile -t API_DLLS < <(find src/Autheris.Api/obj/Release -type f -path "*/${RID}/Autheris.Api.dll" -not -path "*/ref/*" -not -path "*/refint/*")
            if [ "${#API_DLLS[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one compiled Autheris.Api.dll for $RID, found ${#API_DLLS[@]}"
              exit 1
            fi
            API_DLL="${API_DLLS[0]}"
            AUTHERIS_RELEASE_API_ASSEMBLY="$PWD/$API_DLL" dotnet test tests/Autheris.Tests.Architecture/Autheris.Tests.Architecture.csproj \
              -c Release --no-build \
              --filter "FullyQualifiedName~ReleaseBuildExcludesTestAuthTests"

            ARCHIVE_NAME="Autheris-${RID}"
            if [ "$ARCHIVE" = "zip" ]; then
              (cd "$OUT_DIR" && zip -r "../../artifacts/${ARCHIVE_NAME}.zip" .)
            else
              tar -czvf "artifacts/${ARCHIVE_NAME}.tar.gz" -C "$OUT_DIR" .
            fi
          done

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum Autheris-* > SHA256SUMS
          cat SHA256SUMS

      - name: Attest Build Provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'artifacts/Autheris-*'

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign Checksums (keyless)
        run: |
          cosign sign-blob --yes --bundle artifacts/SHA256SUMS.sigstore.json artifacts/SHA256SUMS

      - name: Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # MISC-02: publishing runs in a protected environment (required reviewers configured in the repository settings).
    environment: release
    permissions:
      contents: write
    steps:
      - name: Fail if a release for the tag already exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Error: a release for '$RELEASE_TAG' already exists" >&2
            exit 1
          fi

      - name: Download Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
          overwrite_files: false
