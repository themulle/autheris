name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions: {}

jobs:
  footprint:
    name: Footprint & CI Duration Budget Gate
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/footprint-budget.yml

  build:
    name: Build, Attest & Sign Release Binaries
    needs: footprint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Error: '$RELEASE_TAG' is not a release tag" >&2
            exit 1
          fi

      - name: Derive version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Error: '$VERSION' does not match semver pattern" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # MISC-02: build exactly the tagged commit, never the dispatching branch head.
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}

      - name: Nightly gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TARGET_SHA="$(git rev-parse HEAD)"
          else
            TARGET_SHA="$GITHUB_SHA"
          fi
          WORKFLOWS=("parity-nightly.yml" "sql-compiler-gate-nightly.yml")
          for WF in "${WORKFLOWS[@]}"; do
            echo "Checking completed run for $WF matching commit $TARGET_SHA..."
            RUN_JSON=$(gh run list --workflow "$WF" --commit "$TARGET_SHA" --status completed --limit 1 --json conclusion,headSha)
            HEAD_SHA=$(jq -r '.[0].headSha // empty' <<< "$RUN_JSON")
            CONCLUSION=$(jq -r '.[0].conclusion // empty' <<< "$RUN_JSON")
            if [ "$HEAD_SHA" != "$TARGET_SHA" ] || [ "$CONCLUSION" != "success" ]; then
              echo "::error::Nightly gate failed: $WF has no successful completed run for commit '$TARGET_SHA' (found headSha='$HEAD_SHA', conclusion='$CONCLUSION')" >&2
              exit 1
            fi
            echo "Workflow $WF is green for $TARGET_SHA (headSha: $HEAD_SHA, conclusion: $CONCLUSION)."
          done

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore with Locked Mode
        run: dotnet restore Autheris.sln --locked-mode

      - name: Vulnerable Package Audit
        run: |
          dotnet list Autheris.sln package --vulnerable --include-transitive --format json --output-version 1 > vulnerable.json
          jq -e '[.projects[].frameworks[]? | (.topLevelPackages // []) + (.transitivePackages // []) | .[]] | length == 0' vulnerable.json \
            || { echo "::error::Vulnerable NuGet packages detected"; jq . vulnerable.json; exit 1; }

      # CR-ADG-11: with CI=true the Spark proxy tests fail without the pinned image (AstCompilerDatabricksSparkExecutionTests.Image).
      - name: Pull pinned Spark proxy image
        run: docker pull apache/spark:4.0.0-python3@sha256:9e2f63442ba1a672ea70d780d56da28f42ce515d0be18840569a3054cc6d2314

      - name: Run Test Suite
        run: dotnet test Autheris.sln -c Release --no-restore -p:AutherisIncludeTestAuth=true --filter "Category!=Spark&Category!=NightlyGate&Category!=Metamorphic&Category!=Fuzz&Category!=Mutant&Category!=Parity&FullyQualifiedName!~Autheris.Tests.Integration." --verbosity normal

      - name: Build and Package Binaries
        run: |
          mkdir -p dist
          mkdir -p artifacts

          TARGETS=(
            "linux-x64:tar:Autheris.Api"
            "linux-arm64:tar:Autheris.Api"
            "win-x64:zip:Autheris.Api.exe"
            "osx-arm64:tar:Autheris.Api"
          )

          for TARGET in "${TARGETS[@]}"; do
            IFS=":" read -r RID ARCHIVE BINARY <<< "$TARGET"
            echo "==> Building for $RID..."
            OUT_DIR="dist/$RID"

            dotnet publish src/Autheris.Api/Autheris.Api.csproj \
              -c Release \
              -r "$RID" \
              --self-contained true \
              -p:PublishSingleFile=true \
              -p:AutherisIncludeTestAuth=false \
              -p:Version="$VERSION" \
              -o "$OUT_DIR"

            # Single-file bundles embed the assembly, so scan the per-RID compiled assembly (SC-04).
            mapfile -t API_DLLS < <(find src/Autheris.Api/obj/Release -type f -path "*/${RID}/Autheris.Api.dll" -not -path "*/ref/*" -not -path "*/refint/*")
            if [ "${#API_DLLS[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one compiled Autheris.Api.dll for $RID, found ${#API_DLLS[@]}"
              exit 1
            fi
            API_DLL="${API_DLLS[0]}"
            AUTHERIS_RELEASE_API_ASSEMBLY="$PWD/$API_DLL" dotnet test tests/Autheris.Tests.Architecture/Autheris.Tests.Architecture.csproj \
              -c Release --no-build \
              --filter "FullyQualifiedName~ReleaseBuildExcludesTestAuthTests"

            ARCHIVE_NAME="Autheris-${RID}"
            if [ "$ARCHIVE" = "zip" ]; then
              (cd "$OUT_DIR" && zip -r "../../artifacts/${ARCHIVE_NAME}.zip" .)
            else
              tar -czvf "artifacts/${ARCHIVE_NAME}.tar.gz" -C "$OUT_DIR" .
            fi
          done

      - name: Package Helm chart
        run: |
          helm package deploy/helm/autheris --version "$VERSION" --app-version "$VERSION" -d dist
          cp "dist/autheris-${VERSION}.tgz" artifacts/

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          bash scripts/release/validate-release-version.sh --self-test
          mapfile -t API_DLLS < <(find src/Autheris.Api/obj/Release -type f -path "*/linux-x64/Autheris.Api.dll" -not -path "*/ref/*" -not -path "*/refint/*")
          if [ "${#API_DLLS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one compiled Autheris.Api.dll for linux-x64, found ${#API_DLLS[@]}"
            exit 1
          fi
          IMAGE_REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          bash scripts/release/validate-release-version.sh "$RELEASE_TAG" "${API_DLLS[0]}" "dist/autheris-${VERSION}.tgz" "$IMAGE_REPO"

      - name: Extract release notes
        run: |
          bash scripts/release/extract-changelog.sh "$VERSION" > dist/RELEASE_NOTES.md
          cp dist/RELEASE_NOTES.md artifacts/

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum Autheris-* autheris-* > SHA256SUMS
          cat SHA256SUMS

      - name: Attest Build Provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'artifacts/Autheris-*'

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign Checksums (keyless)
        run: |
          cosign sign-blob --yes --bundle artifacts/SHA256SUMS.sigstore.json artifacts/SHA256SUMS

      - name: Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # MISC-02: publishing runs in a protected environment (required reviewers configured in the repository settings).
    environment: release
    permissions:
      contents: write
    steps:
      - name: Fail if a release for the tag already exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Error: a release for '$RELEASE_TAG' already exists" >&2
            exit 1
          fi

      - name: Download Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: artifacts

      - name: Prepare release notes
        run: |
          mkdir -p dist
          cp artifacts/RELEASE_NOTES.md dist/RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: artifacts/*
          body_path: dist/RELEASE_NOTES.md
          overwrite_files: false

  module-package:
    name: Pack & Sign Release Modules
    needs: release
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: module-release
    permissions:
      contents: write
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}

      - name: Setup .NET 11
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore with Locked Mode
        run: dotnet restore Autheris.sln --locked-mode

      - name: Derive version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          HOST_VERSION="${VERSION%%+*}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "HOST_VERSION=$HOST_VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Publish ModuleSigner and Modules
        run: |
          mkdir -p dist/modules artifacts
          dotnet publish tools/Autheris.ModuleSigner/Autheris.ModuleSigner.csproj -c Release --no-restore -o ./dist/tools/module-signer
          for csproj in modules/*/*.csproj; do
            case "$csproj" in
              *.Tests.csproj) continue ;;
            esac
            proj_name="$(basename "$csproj" .csproj)"
            short_name="${proj_name#Autheris.Modules.}"
            module_id="$(printf '%s' "$short_name" | tr '[:upper:]' '[:lower:]')"
            module_out="dist/modules/${module_id}"
            dotnet publish "$csproj" -c Release --no-restore -p:Version="$VERSION" -o "$module_out"
            # Keep only Linux x64/arm64 runtimes if a module ever ships private native assets, before signing the manifest.
            find "$module_out/runtimes" -mindepth 1 -maxdepth 1 ! -name linux-x64 ! -name linux-arm64 -exec rm -rf {} + 2>/dev/null || true
          done

      - name: Sign and Archive Modules
        env:
          AUTHERIS_MODULE_SIGNING_KEY_PEM: ${{ secrets.AUTHERIS_MODULE_SIGNING_KEY_PEM }}
        run: |
          if [ -z "${AUTHERIS_MODULE_SIGNING_KEY_PEM:-}" ]; then
            echo "Error: AUTHERIS_MODULE_SIGNING_KEY_PEM secret is required in module-release environment." >&2
            exit 1
          fi
          for module_out in dist/modules/*; do
            [ -d "$module_out" ] || continue
            module_id="$(basename "$module_out")"
            dotnet ./dist/tools/module-signer/Autheris.ModuleSigner.dll \
              --dir "$module_out" \
              --id "$module_id" \
              --version "$HOST_VERSION" \
              --host-version "$HOST_VERSION"
          done
          archive="artifacts/Autheris-modules-${VERSION}.tar.gz"
          tar -czf "$archive" -C dist/modules .
          (cd artifacts && sha256sum "Autheris-modules-${VERSION}.tar.gz" > "Autheris-modules-${VERSION}.tar.gz.sha256")

      - name: Upload signed module archive to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "artifacts/Autheris-modules-${VERSION}.tar.gz" \
            "artifacts/Autheris-modules-${VERSION}.tar.gz.sha256"
