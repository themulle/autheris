name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (z. B. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions: {}

jobs:
  build:
    name: Build, Attest & Sign Release Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore with Locked Mode
        run: dotnet restore Autheris.sln --locked-mode

      - name: Vulnerable Package Audit
        run: |
          dotnet list Autheris.sln package --vulnerable --include-transitive --format json --output-version 1 > vulnerable.json
          jq -e '[.projects[].frameworks[]? | (.topLevelPackages // []) + (.transitivePackages // []) | .[]] | length == 0' vulnerable.json \
            || { echo "::error::Vulnerable NuGet packages detected"; jq . vulnerable.json; exit 1; }

      - name: Run Test Suite
        run: dotnet test Autheris.sln -c Release --no-restore --verbosity normal

      - name: Build and Package Binaries
        run: |
          mkdir -p dist
          mkdir -p artifacts

          TARGETS=(
            "linux-x64:tar:Autheris.Api"
            "linux-arm64:tar:Autheris.Api"
            "win-x64:zip:Autheris.Api.exe"
            "osx-arm64:tar:Autheris.Api"
          )

          for TARGET in "${TARGETS[@]}"; do
            IFS=":" read -r RID ARCHIVE BINARY <<< "$TARGET"
            echo "==> Building for $RID..."
            OUT_DIR="dist/$RID"

            dotnet publish src/Autheris.Api/Autheris.Api.csproj \
              -c Release \
              -r "$RID" \
              --self-contained true \
              -p:PublishSingleFile=true \
              -p:AutherisIncludeTestAuth=false \
              -o "$OUT_DIR"

            if strings "$OUT_DIR/$BINARY" | grep -E "(^TestAuth$|Autheris\.Api\.Security\.TestAuthHandler)" > /dev/null; then
              echo "::error::Security invariant violation: TestAuthHandler found in $RID binary!"
              exit 1
            fi

            ARCHIVE_NAME="Autheris-${RID}"
            if [ "$ARCHIVE" = "zip" ]; then
              (cd "$OUT_DIR" && zip -r "../../artifacts/${ARCHIVE_NAME}.zip" .)
            else
              tar -czvf "artifacts/${ARCHIVE_NAME}.tar.gz" -C "$OUT_DIR" .
            fi
          done

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum Autheris-* > SHA256SUMS
          cat SHA256SUMS

      - name: Attest Build Provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'artifacts/Autheris-*'

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign Checksums (keyless)
        run: |
          cosign sign-blob --yes --bundle artifacts/SHA256SUMS.sigstore.json artifacts/SHA256SUMS

      - name: Upload Artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: release-artifacts
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: release-artifacts
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
