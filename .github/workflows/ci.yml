name: CI Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: {}

# A new push to a pull request cancels its superseded run. Pushes to main share one group per ref and are never cancelled:
# a running run finishes and only the newest pending run survives (at most 1 running + 1 pending).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # WP-OI-CI-1: classifies the change set. dotnet=false (doc-only) never skips a Security-trait suite wholesale; it only narrows
  # the test filters of the jobs below. Dependent jobs use `!cancelled()` so a failed or skipped classifier means the full run.
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      dotnet: ${{ steps.classify.outputs.dotnet }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify changed paths (fail-closed)
        id: classify
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.sha }}
        run: python3 .github/scripts/ci-changes.py

      - name: Test the classifier
        run: python3 -m unittest discover -s .github/scripts -p 'test_ci_changes.py'

  build-and-test:
    name: Build & Test All Suites
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: PR net-LOC check
        if: github.event_name == 'pull_request'
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: bash .github/scripts/pr-net-loc.sh origin/${{ github.base_ref }}

      - name: PR ratchet baseline check
        if: github.event_name == 'pull_request'
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: bash .github/scripts/pr-ratchet-baselines.sh origin/${{ github.base_ref }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore with Locked Mode
        run: dotnet restore Autheris.sln --locked-mode

      - name: Vulnerable Package Audit
        run: |
          dotnet list Autheris.sln package --vulnerable --include-transitive --format json --output-version 1 > vulnerable.json
          jq -e '[.projects[].frameworks[]? | (.topLevelPackages // []) + (.transitivePackages // []) | .[]] | length == 0' vulnerable.json \
            || { echo "::error::Vulnerable NuGet packages detected"; jq . vulnerable.json; exit 1; }

      # WP-TS-02: Autheris.Tests.Integration runs in the parallel integration-tests shards below.
      - name: Test Autheris Solution (excluding Spark and integration)
        timeout-minutes: 15
        env:
          DOTNET_CHANGED: ${{ needs.changes.outputs.dotnet }}
        run: |
          FILTER="Category!=Spark&Category!=NightlyGate&Category!=Metamorphic&Category!=Fuzz&Category!=Mutant&FullyQualifiedName!~Autheris.Tests.Integration."
          # Doc-only change (dotnet=false, fail-closed otherwise): architecture tests read docs/, deploy/, benchmarks/ and README.md,
          # so the whole Architecture project and every Security-trait test still run.
          if [ "$DOTNET_CHANGED" = "false" ]; then
            FILTER="(FullyQualifiedName~Autheris.Tests.Architecture.|Category=Security)&$FILTER"
          fi
          # The Parity exclusion stays literal on the dotnet test line (ParityIsolationArchitectureTests scans it; Parity runs only in the nightly parity workflow).
          dotnet test Autheris.sln -c Release --no-restore -p:AutherisIncludeTestAuth=true --filter "$FILTER&Category!=Parity" --logger "trx" --results-directory ${{ runner.temp }}/test-results --verbosity normal --blame-hang-timeout 5m --blame-hang-dump-type mini --blame-crash

      # WP-ARC-B-12 (D7): the chart must lint and render with and without the optional governance migration job.
      - name: Lint and render Helm chart
        run: |
          helm lint deploy/helm/autheris
          helm template autheris deploy/helm/autheris > /dev/null
          helm template autheris deploy/helm/autheris --set governanceMigrationJob.enabled=true > /dev/null

      # WP-TS-00: publish per-test durations as TRX artifacts so CI timings can be inspected on every run.
      - name: Upload test results (TRX)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-main
          path: ${{ runner.temp }}/test-results
          if-no-files-found: ignore

      - name: Upload crash/hang diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-main
          path: |
            **/Sequence_*.xml
            **/*.dmp
          retention-days: 7
          if-no-files-found: ignore

  # WP-TS-02: Autheris.Tests.Integration runs serially in-process (shared containers, global state), so it is split across
  # parallel jobs instead. .github/scripts/integration-shard-filter.py balances the test classes by measured wall time; the last
  # shard is the exact complement of the others, so every test runs in exactly one shard.
  integration-tests:
    name: Integration Tests (shard ${{ matrix.shard }}/4)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest # Docker is available for Testcontainers
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      # WP-OI-CI-4: use the pre-pulled, digest-pinned Ryuk image (TestImages.Ryuk).
      TESTCONTAINERS_RYUK_CONTAINER_IMAGE: testcontainers/ryuk:0.14.0@sha256:7c1a8a9a47c780ed0f983770a662f80deb115d95cce3e2daa3d12115b8cd28f0
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore with Locked Mode
        run: dotnet restore Autheris.sln --locked-mode

      # WP-OI-CI-4: pull the pinned Testcontainers images in the background while the build runs (list: tests/test-images.txt,
      # mirrored by TestImages.cs). A failed pull is surfaced by the wait step; tests still pull on demand.
      - name: Pre-pull Testcontainers images (background)
        run: |
          : > "$RUNNER_TEMP/prepull.log"
          setsid bash -c '
            while IFS= read -r image; do
              [ -n "$image" ] || continue
              ( docker pull --quiet "$image" >> "$RUNNER_TEMP/prepull.log" 2>&1 || echo "PREPULL-FAILED: $image" >> "$RUNNER_TEMP/prepull.log" ) &
            done < tests/test-images.txt
            wait
            echo "PREPULL-DONE" >> "$RUNNER_TEMP/prepull.log"
          ' > /dev/null 2>&1 &

      - name: Build integration tests
        run: dotnet build tests/Autheris.Tests.Integration -c Release --no-restore -p:AutherisIncludeTestAuth=true

      - name: Wait for image pre-pull
        run: |
          for _ in $(seq 1 120); do
            grep -q '^PREPULL-DONE$' "$RUNNER_TEMP/prepull.log" && break
            sleep 5
          done
          cat "$RUNNER_TEMP/prepull.log"
          grep -q '^PREPULL-DONE$' "$RUNNER_TEMP/prepull.log" || echo "::warning::Image pre-pull did not finish; tests pull on demand"
          if grep -q '^PREPULL-FAILED:' "$RUNNER_TEMP/prepull.log"; then
            echo "::warning::Some images failed to pre-pull; tests pull on demand and fail on their own if the registry is unavailable"
          fi

      - name: Test integration shard
        timeout-minutes: 85
        env:
          SHARD: ${{ matrix.shard }}
          DOTNET_CHANGED: ${{ needs.changes.outputs.dotnet }}
        run: |
          FILTER="$(python3 .github/scripts/integration-shard-filter.py "$((SHARD - 1))" 4)"
          # Doc-only change: only the Security-trait tests of this shard run (never drop a Security suite).
          if [ "$DOTNET_CHANGED" = "false" ]; then FILTER="($FILTER)&Category=Security"; fi
          dotnet test tests/Autheris.Tests.Integration -c Release --no-build -p:AutherisIncludeTestAuth=true --filter "$FILTER" --logger "trx" --results-directory ${{ runner.temp }}/test-results --blame-hang-timeout 5m --blame-hang-dump-type mini --blame-crash

      - name: Upload integration test results (TRX)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-integration-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-results
          if-no-files-found: ignore

      - name: Upload integration crash/hang diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-integration-${{ matrix.shard }}
          path: |
            **/Sequence_*.xml
            **/*.dmp
          retention-days: 7
          if-no-files-found: ignore

  # WP-TS-03: run Databricks/Spark proxy execution tests in a dedicated parallel job so the main test job does not wait on the Spark container.
  spark-integration-tests:
    name: Spark Integration Tests
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # WP-OI-CI-4: use the pre-pulled, digest-pinned Ryuk image (TestImages.Ryuk).
      TESTCONTAINERS_RYUK_CONTAINER_IMAGE: testcontainers/ryuk:0.14.0@sha256:7c1a8a9a47c780ed0f983770a662f80deb115d95cce3e2daa3d12115b8cd28f0
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore with Locked Mode
        run: dotnet restore Autheris.sln --locked-mode

      # CR-ADG-11: with CI=true the Spark proxy tests fail without the pinned image (TestImages.Spark, listed in tests/test-images.txt).
      - name: Pull pinned Spark proxy image
        run: docker pull "$(grep '^apache/spark:' tests/test-images.txt)"

      - name: Test Spark Integration Suite
        timeout-minutes: 12
        env:
          DOTNET_CHANGED: ${{ needs.changes.outputs.dotnet }}
        run: |
          FILTER="Category=Spark"
          # Doc-only change: keep the Spark-hosted Security tests (DatabricksTransportParityTests).
          if [ "$DOTNET_CHANGED" = "false" ]; then FILTER="Category=Spark&Category=Security"; fi
          dotnet test tests/Autheris.Tests.Integration -c Release --no-restore -p:AutherisIncludeTestAuth=true --filter "$FILTER" --logger "trx" --results-directory ${{ runner.temp }}/test-results --verbosity normal --blame-hang-timeout 5m --blame-hang-dump-type mini --blame-crash

      - name: Upload Spark test results (TRX)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-spark
          path: ${{ runner.temp }}/test-results
          if-no-files-found: ignore

      - name: Upload Spark crash/hang diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-spark
          path: |
            **/Sequence_*.xml
            **/*.dmp
          retention-days: 7
          if-no-files-found: ignore

  # SEC2-09: production Helm render guards and container hardening posture (deploy/scripts/verify-hardening.sh).
  helm-render:
    name: Helm Render & Hardening Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: Verify hardening and Helm render guards
        run: |
          command -v helm
          bash deploy/scripts/verify-hardening.sh

  # SQL compiler evidence gate (plan 9.5, 16.5). It must run on the merge result: a pull_request run checks out
  # refs/pull/N/merge by default, so no explicit `ref:` is set (a test in tests/Autheris.Tests.SqlCompilerGate asserts that).
  # There is deliberately no path filter (policy producers live outside src/TrinoSqlEngine) and no retry of any kind
  # (M-5: a retried security test could turn a real failure green).
  # Making this job a required check is a repository-admin step (branch protection), see the WP-X0w log in the plan.
  sql-compiler-gate:
    name: SQL Compiler Gate
    # No `needs`: the gate starts in parallel with the other jobs (it builds what it tests), so it is not on the critical path.
    runs-on: ubuntu-latest # Docker is available for Testcontainers
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SQLGATE_PROFILE: pr
      SQLGATE_REPORT_DIR: ${{ github.workspace }}/sqlgate-report
    steps:
      - name: Checkout repository (merge ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore with Locked Mode
        run: dotnet restore Autheris.sln --locked-mode

      # G2, G3, G5 in-memory, G7. Debug and Release compile the same security code (ARC-S-06); the mutant hooks live in the test assembly.
      # The Release run of the same tests is part of the build-and-test job (all of TrinoSqlEngine.Tests in Release).
      - name: Gate tests, Debug (security mutants)
        run: dotnet test tests/TrinoSqlEngine.Tests -c Debug --no-restore --filter "Category=SqlGate&Category!=NightlyGate&Category!=Metamorphic&Category!=Fuzz&Category!=Mutant" --verbosity normal

      # G4 differential, G6 execution on PostgreSQL, SQL Server and Oracle (CI=true makes a missing database fail).
      - name: Differential and execution gate
        run: dotnet test tests/Autheris.Tests.SqlCompilerGate -c Release --no-restore -p:AutherisIncludeTestAuth=true --verbosity normal

      # The architecture tests run in the build-and-test job; the G8 performance benchmark runs in sql-compiler-gate-nightly.yml.

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sqlgate-report
          path: sqlgate-report
          if-no-files-found: ignore
