name: CI Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: {}

jobs:
  build-and-test:
    name: Build & Test All Suites
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore with Locked Mode
        run: dotnet restore Autheris.sln --locked-mode

      - name: Vulnerable Package Audit
        run: |
          dotnet list Autheris.sln package --vulnerable --include-transitive --format json --output-version 1 > vulnerable.json
          jq -e '[.projects[].frameworks[]? | (.topLevelPackages // []) + (.transitivePackages // []) | .[]] | length == 0' vulnerable.json \
            || { echo "::error::Vulnerable NuGet packages detected"; jq . vulnerable.json; exit 1; }

      - name: Test Autheris Solution (excluding Spark)
        run: dotnet test Autheris.sln -c Release --no-restore -p:AutherisIncludeTestAuth=true --filter "Category!=Spark" --logger "trx" --results-directory ${{ runner.temp }}/test-results --verbosity normal

      # WP-ARC-B-12 (D7): the chart must lint and render with and without the optional governance migration job.
      - name: Lint and render Helm chart
        run: |
          helm lint deploy/helm/autheris
          helm template autheris deploy/helm/autheris > /dev/null
          helm template autheris deploy/helm/autheris --set governanceMigrationJob.enabled=true > /dev/null

      # WP-TS-00: publish per-test durations as TRX artifacts so CI timings can be inspected on every run.
      - name: Upload test results (TRX)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-main
          path: ${{ runner.temp }}/test-results
          if-no-files-found: ignore

  # WP-TS-03: run Databricks/Spark proxy execution tests in a dedicated parallel job so the main test job does not wait on the Spark container.
  spark-integration-tests:
    name: Spark Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore with Locked Mode
        run: dotnet restore Autheris.sln --locked-mode

      # CR-ADG-11: with CI=true the Spark proxy tests fail without the pinned image (AstCompilerDatabricksSparkExecutionTests.Image).
      - name: Pull pinned Spark proxy image
        run: docker pull apache/spark:4.0.0-python3@sha256:9e2f63442ba1a672ea70d780d56da28f42ce515d0be18840569a3054cc6d2314

      - name: Test Spark Integration Suite
        run: dotnet test tests/Autheris.Tests.Integration -c Release --no-restore -p:AutherisIncludeTestAuth=true --filter "Category=Spark" --logger "trx" --results-directory ${{ runner.temp }}/test-results --verbosity normal

      - name: Upload Spark test results (TRX)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-spark
          path: ${{ runner.temp }}/test-results
          if-no-files-found: ignore

  # SEC2-09: production Helm render guards and container hardening posture (deploy/scripts/verify-hardening.sh).
  helm-render:
    name: Helm Render & Hardening Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: Verify hardening and Helm render guards
        run: |
          command -v helm
          bash deploy/scripts/verify-hardening.sh

  # SQL compiler evidence gate (plan 9.5, 16.5). It must run on the merge result: a pull_request run checks out
  # refs/pull/N/merge by default, so no explicit `ref:` is set (a test in tests/Autheris.Tests.SqlCompilerGate asserts that).
  # There is deliberately no path filter (policy producers live outside src/TrinoSqlEngine) and no retry of any kind
  # (M-5: a retried security test could turn a real failure green).
  # Making this job a required check is a repository-admin step (branch protection), see the WP-X0w log in the plan.
  sql-compiler-gate:
    name: SQL Compiler Gate
    needs: [build-and-test, spark-integration-tests]
    runs-on: ubuntu-latest # Docker is available for Testcontainers
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SQLGATE_PROFILE: pr
      SQLGATE_REPORT_DIR: ${{ github.workspace }}/sqlgate-report
    steps:
      - name: Checkout repository (merge ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore with Locked Mode
        run: dotnet restore Autheris.sln --locked-mode

      # G2, G3, G5 in-memory, G7. Debug and Release compile the same security code (ARC-S-06); the mutant hooks live in the test assembly,
      # so both runs kill the mutants.
      - name: Gate tests, Debug (security mutants)
        run: dotnet test tests/TrinoSqlEngine.Tests -c Debug --no-restore --filter "Category=SqlGate" --verbosity normal

      - name: Gate tests, Release (security mutants, no hooks in shipped code)
        run: dotnet test tests/TrinoSqlEngine.Tests -c Release --no-restore --filter "Category=SqlGate" --verbosity normal

      # G4 differential, G6 execution on PostgreSQL, SQL Server and Oracle (CI=true makes a missing database fail).
      - name: Differential and execution gate
        run: dotnet test tests/Autheris.Tests.SqlCompilerGate -c Release --no-restore -p:AutherisIncludeTestAuth=true --verbosity normal

      - name: Architecture tests
        run: dotnet test tests/Autheris.Tests.Architecture -c Release --no-restore -p:AutherisIncludeTestAuth=true --verbosity normal

      # G8: the AST compiler is measured and compared with the frozen legacy baseline (benchmarks/baselines/sql-compiler-legacy.json) by bytes (allocation) and Gen2 count.
      - name: G8 performance benchmark
        run: dotnet run -c Release --no-restore --project benchmarks/Autheris.Benchmarks -- --filter "*SqlCompiler*" --job short --inProcess --exporters json --artifacts benchmarks/results

      - name: G8 thresholds
        run: dotnet run -c Release --no-restore --project tools/SqlGate.BenchCheck -- benchmarks/results benchmarks/baselines

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sqlgate-report
          path: |
            sqlgate-report
            benchmarks/results
          if-no-files-found: ignore
