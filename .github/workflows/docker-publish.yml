name: Build & Push Getting-Started Container

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image Tag (z. B. getting-started, v1.0.0, latest)'
        required: true
        default: 'getting-started'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Container to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore with Locked Mode
        run: dotnet restore Autheris.sln --locked-mode

      - name: Run Test Suite
        run: dotnet test Autheris.sln -c Release --no-restore --verbosity normal

      - name: Publish Autheris
        run: |
          dotnet publish src/Autheris.Api/Autheris.Api.csproj \
            -c Release \
            --no-restore \
            -o ./dist/publish

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Docker Image Tags
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAGS=()
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [[ ! "$INPUT_TAG" =~ ^[a-zA-Z0-9_.-]+$ ]]; then
              echo "Error: Invalid docker tag '$INPUT_TAG'" >&2
              exit 1
            fi
            TAGS+=("${IMAGE}:${INPUT_TAG}")
            if [ "$INPUT_TAG" = "latest" ]; then
              TAGS+=("${IMAGE}:getting-started")
            fi
          elif [ "$REF_TYPE" = "tag" ]; then
            TAGS+=("${IMAGE}:${REF_NAME}")
            TAGS+=("${IMAGE}:latest")
            TAGS+=("${IMAGE}:getting-started")
          else
            # Push on main
            TAGS+=("${IMAGE}:latest")
            TAGS+=("${IMAGE}:getting-started")
            TAGS+=("${IMAGE}:${COMMIT_SHA}")
          fi
          TAGS_STR=$(printf "%s\n" "${TAGS[@]}")
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "$TAGS_STR" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Supply-chain attestations (SLSA provenance + SPDX SBOM) attached to the image
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
