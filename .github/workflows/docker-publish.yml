name: Build & Push Getting-Started Container

on:
  push:
    tags: [ 'v*' ]
  # Scan-only job for pull requests (no environment, no secrets, no push); keeps the code scanning configuration of main comparable.
  pull_request:
    branches: [ main ]
  workflow_run:
    workflows: [ "CI Build & Test" ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image Tag (z. B. getting-started, v1.0.0, latest)'
        required: true
        default: 'getting-started'

permissions: {}

# Pull request runs cancel superseded runs. Tag, workflow_dispatch and workflow_run runs keep one group per run and are never
# cancelled; the workflow_run trigger fires per completed main CI run, and coalesced CI (ci.yml) leaves only the newest main commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-push:
    name: Build, Scan & Push Container to GHCR
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main'))
    # MISC-01: release publishing runs in a protected environment (required reviewers configured in the repository settings).
    environment: release
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
      image_digest_full: ${{ steps.push-full.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup .NET 11
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore with Locked Mode
        run: dotnet restore Autheris.sln --locked-mode

      - name: Vulnerable Package Audit
        run: |
          dotnet list Autheris.sln package --vulnerable --include-transitive --format json --output-version 1 > vulnerable.json
          jq -e '[.projects[].frameworks[]? | (.topLevelPackages // []) + (.transitivePackages // []) | .[]] | length == 0' vulnerable.json \
            || { echo "::error::Vulnerable NuGet packages detected"; jq . vulnerable.json; exit 1; }

      # CR-ADG-11: with CI=true the Spark proxy tests fail without the pinned image (AstCompilerDatabricksSparkExecutionTests.Image).
      - name: Pull pinned Spark proxy image
        run: docker pull apache/spark:4.0.0-python3@sha256:9e2f63442ba1a672ea70d780d56da28f42ce515d0be18840569a3054cc6d2314

      - name: Run Test Suite
        run: dotnet test Autheris.sln -c Release --no-restore -p:AutherisIncludeTestAuth=true --filter "Category!=Spark&Category!=NightlyGate&Category!=Metamorphic&Category!=Fuzz&Category!=Mutant&Category!=Parity&FullyQualifiedName!~Autheris.Tests.Integration." --verbosity normal

      - name: Derive version
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev+${GITHUB_SHA::7}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish Autheris
        run: |
          dotnet publish src/Autheris.Api/Autheris.Api.csproj \
            -c Release \
            --no-restore \
            -p:AutherisIncludeTestAuth=false \
            -p:Version="$VERSION" \
            -o ./dist/publish

      - name: Prepare and Sign Modules
        env:
          AUTHERIS_MODULE_SIGNING_KEY_PEM: ${{ secrets.AUTHERIS_MODULE_SIGNING_KEY_PEM }}
        run: |
          mkdir -p dist/modules
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]] && [ -z "${AUTHERIS_MODULE_SIGNING_KEY_PEM:-}" ]; then
            echo "Error: AUTHERIS_MODULE_SIGNING_KEY_PEM is required for tagged container releases." >&2
            exit 1
          fi
          if [ -n "${AUTHERIS_MODULE_SIGNING_KEY_PEM:-}" ]; then
            HOST_VERSION="${VERSION%%+*}"
            dotnet build tools/Autheris.ModuleSigner/Autheris.ModuleSigner.csproj -c Release --no-restore
            # The full image flavor verifies every module offline with this tool against the embedded release public key.
            dotnet publish tools/Autheris.ModuleSigner/Autheris.ModuleSigner.csproj -c Release --no-restore -o ./dist/tools/module-signer
            dotnet publish modules/Autheris.Modules.Lakehouse/Autheris.Modules.Lakehouse.csproj \
              -c Release \
              --no-restore \
              -p:Version="$VERSION" \
              -o ./dist/modules/lakehouse
            # The module host rejects module files larger than 256 MiB (the macOS/Windows DuckDB natives are large); the image is linux-x64 only.
            find ./dist/modules/lakehouse/runtimes -mindepth 1 -maxdepth 1 ! -name linux-x64 -exec rm -rf {} + 2>/dev/null || true
            find ./dist/modules/lakehouse -type f -size +64M -print >&2
            dotnet run --project tools/Autheris.ModuleSigner/Autheris.ModuleSigner.csproj -c Release --no-build -- \
              --dir ./dist/modules/lakehouse \
              --id lakehouse \
              --version "$HOST_VERSION" \
              --host-version "$HOST_VERSION"
            dotnet publish modules/Autheris.Modules.Dbt/Autheris.Modules.Dbt.csproj \
              -c Release \
              --no-restore \
              -p:Version="$VERSION" \
              -o ./dist/modules/dbt
            dotnet run --project tools/Autheris.ModuleSigner/Autheris.ModuleSigner.csproj -c Release --no-build -- \
              --dir ./dist/modules/dbt \
              --id dbt \
              --version "$HOST_VERSION" \
              --host-version "$HOST_VERSION"
          fi

      - name: Verify TestAuthHandler is Excluded from Publish Output (SC-04)
        env:
          AUTHERIS_RELEASE_API_ASSEMBLY: ${{ github.workspace }}/dist/publish/Autheris.Api.dll
        run: |
          dotnet test tests/Autheris.Tests.Architecture/Autheris.Tests.Architecture.csproj \
            -c Release --no-build \
            --filter "FullyQualifiedName~ReleaseBuildExcludesTestAuthTests"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build local image for scanning
        id: build-local
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          build-args: |
            FLAVOR=core
          tags: autheris:scan
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}

      - name: Trivy Container Vulnerability Scan (Gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: autheris:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'
          format: sarif
          output: trivy-results.sarif

      # The full flavor needs the signed modules from the signing step; main pushes without the signing key publish core only.
      - name: Build local full image for scanning
        id: build-local-full
        if: hashFiles('dist/modules/*/module.json') != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          build-args: |
            FLAVOR=full
          tags: autheris-full:scan
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}

      - name: Trivy Container Vulnerability Scan (Gate, full)
        if: hashFiles('dist/modules/*/module.json') != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: autheris-full:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'
          format: sarif
          output: trivy-results-full.sarif

      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-results.sarif

      - name: Compute Docker Image Tags
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          VERSION: ${{ env.VERSION }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAGS=()
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [[ ! "$INPUT_TAG" =~ ^[a-zA-Z0-9_.-]+$ ]]; then
              echo "Error: Invalid docker tag '$INPUT_TAG'" >&2
              exit 1
            fi
            # MISC-01: a manual dispatch can never overwrite release tags or :latest; releases come from pushed v* tags only.
            if [ "$INPUT_TAG" = "latest" ] || [[ "$INPUT_TAG" =~ ^v[0-9] ]]; then
              echo "Error: tag '$INPUT_TAG' is reserved for tag-triggered releases" >&2
              exit 1
            fi
            TAGS+=("${IMAGE}:${INPUT_TAG}")
          elif [ "$REF_TYPE" = "tag" ]; then
            TAGS+=("${IMAGE}:${REF_NAME}")
            TAGS+=("${IMAGE}:${VERSION}")
            if [[ "$VERSION" != *-* ]]; then
              TAGS+=("${IMAGE}:latest")
              TAGS+=("${IMAGE}:getting-started")
            fi
          else
            # Push on main (workflow_run / push on main)
            # SC-01: No latest on main branch pushes
            TAGS+=("${IMAGE}:main")
            TAGS+=("${IMAGE}:sha-${COMMIT_SHA}")
          fi
          TAGS_STR=$(printf "%s\n" "${TAGS[@]}")
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "$TAGS_STR" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          # The full flavor is a separate image name (autheris-full) with the same tag scheme.
          FULL_TAGS_STR=$(printf "%s\n" "${TAGS[@]/#${IMAGE}:/${IMAGE}-full:}")
          echo "tags_full<<EOF" >> $GITHUB_OUTPUT
          echo "$FULL_TAGS_STR" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Supply-chain attestations (SLSA provenance + SPDX SBOM) attached to the image
          provenance: mode=max
          sbom: true
          build-args: |
            FLAVOR=core
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}

      - name: Build and push full Docker image
        id: push-full
        if: hashFiles('dist/modules/*/module.json') != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            FLAVOR=full
          tags: ${{ steps.meta.outputs.tags_full }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign by digest (keyless)
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE,,}@${DIGEST}"

      - name: Verify signature (self-check)
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign verify "${IMAGE,,}@${DIGEST}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/themulle/autheris/\.github/workflows/docker-publish\.yml@refs/(heads/main|tags/v.+)$'
          echo "Published digest: ${DIGEST}" >> "$GITHUB_STEP_SUMMARY"

      - name: Sign full image by digest (keyless)
        if: steps.push-full.outputs.digest != ''
        env:
          IMAGE: ghcr.io/${{ github.repository }}-full
          DIGEST: ${{ steps.push-full.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE,,}@${DIGEST}"
          cosign verify "${IMAGE,,}@${DIGEST}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/themulle/autheris/\.github/workflows/docker-publish\.yml@refs/(heads/main|tags/v.+)$'
          echo "Published full digest: ${DIGEST}" >> "$GITHUB_STEP_SUMMARY"

  pr-container-scan:
    name: Container Scan (pull request)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET 11
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore with Locked Mode
        run: dotnet restore Autheris.sln --locked-mode

      - name: Derive version
        run: |
          VERSION="0.0.0-dev+${GITHUB_SHA::7}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish Autheris
        run: |
          dotnet publish src/Autheris.Api/Autheris.Api.csproj \
            -c Release \
            --no-restore \
            -p:AutherisIncludeTestAuth=false \
            -p:Version="$VERSION" \
            -o ./dist/publish

      - name: Prepare empty modules directory for container scan
        run: mkdir -p dist/modules

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build local image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: autheris:scan
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}

      - name: Trivy Container Vulnerability Scan (Gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: autheris:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-results.sarif
          category: .github/workflows/docker-publish.yml:build-and-push

  module-e2e:
    name: Verify Signed Module Container Routes (E2E)
    needs: build-and-push
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout repository (scripts only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Start published container with signed modules and assert endpoints
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}-full@${{ needs.build-and-push.outputs.image_digest_full }}
        run: bash .github/scripts/module-e2e.sh

  # Branch verification of the signed module container e2e: manual dispatch on a non-main ref builds the full image locally (no push,
  # no tags, no release) and runs the same script as the published-image job. The job reads the module signing key, so it runs in the
  # protected module-release environment (required reviewers).
  module-e2e-branch:
    name: Verify Signed Module Container Routes (E2E, branch build)
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    environment: module-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore with Locked Mode
        run: dotnet restore Autheris.sln --locked-mode

      - name: Publish Autheris and sign the modules
        env:
          AUTHERIS_MODULE_SIGNING_KEY_PEM: ${{ secrets.AUTHERIS_MODULE_SIGNING_KEY_PEM }}
        run: |
          if [ -z "${AUTHERIS_MODULE_SIGNING_KEY_PEM:-}" ]; then
            echo "Error: AUTHERIS_MODULE_SIGNING_KEY_PEM is required." >&2
            exit 1
          fi
          VERSION="0.0.0-dev"
          dotnet publish src/Autheris.Api/Autheris.Api.csproj -c Release --no-restore \
            -p:AutherisIncludeTestAuth=false -p:Version="$VERSION" -o ./dist/publish
          mkdir -p dist/modules
          dotnet build tools/Autheris.ModuleSigner/Autheris.ModuleSigner.csproj -c Release --no-restore
          dotnet publish tools/Autheris.ModuleSigner/Autheris.ModuleSigner.csproj -c Release --no-restore -o ./dist/tools/module-signer
          dotnet publish modules/Autheris.Modules.Lakehouse/Autheris.Modules.Lakehouse.csproj -c Release --no-restore \
            -p:Version="$VERSION" -o ./dist/modules/lakehouse
          # The module host rejects module files larger than 256 MiB (the macOS/Windows DuckDB natives are large); the image is linux-x64 only.
          find ./dist/modules/lakehouse/runtimes -mindepth 1 -maxdepth 1 ! -name linux-x64 -exec rm -rf {} + 2>/dev/null || true
          find ./dist/modules/lakehouse -type f -size +64M -print >&2
          dotnet run --project tools/Autheris.ModuleSigner/Autheris.ModuleSigner.csproj -c Release --no-build -- \
            --dir ./dist/modules/lakehouse --id lakehouse --version "$VERSION" --host-version "$VERSION"
          dotnet publish modules/Autheris.Modules.Dbt/Autheris.Modules.Dbt.csproj -c Release --no-restore \
            -p:Version="$VERSION" -o ./dist/modules/dbt
          dotnet run --project tools/Autheris.ModuleSigner/Autheris.ModuleSigner.csproj -c Release --no-build -- \
            --dir ./dist/modules/dbt --id dbt --version "$VERSION" --host-version "$VERSION"

      - name: Build local image
        run: docker build -f Dockerfile --build-arg FLAVOR=full -t autheris:module-e2e .

      - name: Start container with signed modules and assert endpoints
        env:
          IMAGE_REF: autheris:module-e2e
        run: bash .github/scripts/module-e2e.sh
