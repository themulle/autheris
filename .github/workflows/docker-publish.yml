name: Build & Push Getting-Started Container

on:
  push:
    tags: [ 'v*' ]
  # Scan-only job for pull requests (no environment, no secrets, no push); keeps the code scanning configuration of main comparable.
  pull_request:
    branches: [ main ]
  workflow_run:
    workflows: [ "CI Build & Test" ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image Tag (z. B. getting-started, v1.0.0, latest)'
        required: true
        default: 'getting-started'

permissions: {}

# Pull request runs cancel superseded runs. Tag, workflow_dispatch and workflow_run runs keep one group per run and are never
# cancelled; the workflow_run trigger fires per completed main CI run, and coalesced CI (ci.yml) leaves only the newest main commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-push:
    name: Build, Scan & Push Container to GHCR
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main'))
    # MISC-01: release publishing runs in a protected environment (required reviewers configured in the repository settings).
    environment: release
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore with Locked Mode
        run: dotnet restore Autheris.sln --locked-mode

      - name: Vulnerable Package Audit
        run: |
          dotnet list Autheris.sln package --vulnerable --include-transitive --format json --output-version 1 > vulnerable.json
          jq -e '[.projects[].frameworks[]? | (.topLevelPackages // []) + (.transitivePackages // []) | .[]] | length == 0' vulnerable.json \
            || { echo "::error::Vulnerable NuGet packages detected"; jq . vulnerable.json; exit 1; }

      # CR-ADG-11: with CI=true the Spark proxy tests fail without the pinned image (AstCompilerDatabricksSparkExecutionTests.Image).
      - name: Pull pinned Spark proxy image
        run: docker pull apache/spark:4.0.0-python3@sha256:9e2f63442ba1a672ea70d780d56da28f42ce515d0be18840569a3054cc6d2314

      - name: Run Test Suite
        run: dotnet test Autheris.sln -c Release --no-restore -p:AutherisIncludeTestAuth=true --filter "Category!=Spark&Category!=NightlyGate&Category!=Metamorphic&Category!=Fuzz&Category!=Mutant&Category!=Parity&FullyQualifiedName!~Autheris.Tests.Integration." --verbosity normal

      - name: Derive version
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev+${GITHUB_SHA::7}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish Autheris
        run: |
          dotnet publish src/Autheris.Api/Autheris.Api.csproj \
            -c Release \
            --no-restore \
            -p:AutherisIncludeTestAuth=false \
            -p:Version="$VERSION" \
            -o ./dist/publish

      - name: Prepare and Sign Modules
        env:
          AUTHERIS_MODULE_SIGNING_KEY_PEM: ${{ secrets.AUTHERIS_MODULE_SIGNING_KEY_PEM }}
        run: |
          mkdir -p dist/modules
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]] && [ -z "${AUTHERIS_MODULE_SIGNING_KEY_PEM:-}" ]; then
            echo "Error: AUTHERIS_MODULE_SIGNING_KEY_PEM is required for tagged container releases." >&2
            exit 1
          fi
          if [ -n "${AUTHERIS_MODULE_SIGNING_KEY_PEM:-}" ]; then
            HOST_VERSION="${VERSION%%+*}"
            dotnet build tools/Autheris.ModuleSigner/Autheris.ModuleSigner.csproj -c Release --no-restore
            dotnet publish modules/Autheris.Modules.Lakehouse/Autheris.Modules.Lakehouse.csproj \
              -c Release \
              --no-restore \
              -p:Version="$VERSION" \
              -o ./dist/modules/lakehouse
            dotnet run --project tools/Autheris.ModuleSigner/Autheris.ModuleSigner.csproj -c Release --no-build -- \
              --dir ./dist/modules/lakehouse \
              --id lakehouse \
              --version "$HOST_VERSION" \
              --host-version "$HOST_VERSION"
          fi

      - name: Verify TestAuthHandler is Excluded from Publish Output (SC-04)
        env:
          AUTHERIS_RELEASE_API_ASSEMBLY: ${{ github.workspace }}/dist/publish/Autheris.Api.dll
        run: |
          dotnet test tests/Autheris.Tests.Architecture/Autheris.Tests.Architecture.csproj \
            -c Release --no-build \
            --filter "FullyQualifiedName~ReleaseBuildExcludesTestAuthTests"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build local image for scanning
        id: build-local
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: autheris:scan
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}

      - name: Trivy Container Vulnerability Scan (Gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: autheris:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-results.sarif

      - name: Compute Docker Image Tags
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          VERSION: ${{ env.VERSION }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAGS=()
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [[ ! "$INPUT_TAG" =~ ^[a-zA-Z0-9_.-]+$ ]]; then
              echo "Error: Invalid docker tag '$INPUT_TAG'" >&2
              exit 1
            fi
            # MISC-01: a manual dispatch can never overwrite release tags or :latest; releases come from pushed v* tags only.
            if [ "$INPUT_TAG" = "latest" ] || [[ "$INPUT_TAG" =~ ^v[0-9] ]]; then
              echo "Error: tag '$INPUT_TAG' is reserved for tag-triggered releases" >&2
              exit 1
            fi
            TAGS+=("${IMAGE}:${INPUT_TAG}")
          elif [ "$REF_TYPE" = "tag" ]; then
            TAGS+=("${IMAGE}:${REF_NAME}")
            TAGS+=("${IMAGE}:${VERSION}")
            if [[ "$VERSION" != *-* ]]; then
              TAGS+=("${IMAGE}:latest")
              TAGS+=("${IMAGE}:getting-started")
            fi
          else
            # Push on main (workflow_run / push on main)
            # SC-01: No latest on main branch pushes
            TAGS+=("${IMAGE}:main")
            TAGS+=("${IMAGE}:sha-${COMMIT_SHA}")
          fi
          TAGS_STR=$(printf "%s\n" "${TAGS[@]}")
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "$TAGS_STR" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Supply-chain attestations (SLSA provenance + SPDX SBOM) attached to the image
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign by digest (keyless)
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE,,}@${DIGEST}"

      - name: Verify signature (self-check)
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign verify "${IMAGE,,}@${DIGEST}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/themulle/autheris/\.github/workflows/docker-publish\.yml@refs/(heads/main|tags/v.+)$'
          echo "Published digest: ${DIGEST}" >> "$GITHUB_STEP_SUMMARY"

  pr-container-scan:
    name: Container Scan (pull request)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore with Locked Mode
        run: dotnet restore Autheris.sln --locked-mode

      - name: Derive version
        run: |
          VERSION="0.0.0-dev+${GITHUB_SHA::7}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish Autheris
        run: |
          dotnet publish src/Autheris.Api/Autheris.Api.csproj \
            -c Release \
            --no-restore \
            -p:AutherisIncludeTestAuth=false \
            -p:Version="$VERSION" \
            -o ./dist/publish

      - name: Prepare empty modules directory for container scan
        run: mkdir -p dist/modules

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build local image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: autheris:scan
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}

      - name: Trivy Container Vulnerability Scan (Gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: autheris:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-results.sarif
          category: .github/workflows/docker-publish.yml:build-and-push

  module-e2e:
    name: Verify Signed Module Container Routes (E2E)
    needs: build-and-push
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start published container with signed Lakehouse module and assert endpoints
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}@${{ needs.build-and-push.outputs.image_digest }}
        run: |
          IMAGE_REF_LOWER="${IMAGE_REF,,}"
          FWD_SECRET="$(openssl rand -hex 32)"
          trap 'docker rm -f autheris-module-e2e >/dev/null 2>&1 || true' EXIT
          docker run -d --name autheris-module-e2e \
            -p 127.0.0.1:8080:8080 \
            -e ASPNETCORE_ENVIRONMENT=Production \
            -e Gateway__Hosting__AllowedHosts__0=127.0.0.1 \
            -e Gateway__Hosting__AllowedHosts__1=localhost \
            -e Gateway__DataMasking__HmacSecretKeyVaultRef=module-e2e-hmac-placeholder \
            -e Gateway__Authentication__Mode=Upstream \
            -e Gateway__Authentication__ForwardAuth__Enabled=true \
            -e Gateway__Authentication__ForwardAuth__TrustedProxies__0=127.0.0.1/32 \
            -e Gateway__Authentication__ForwardAuth__SharedSecret="$FWD_SECRET" \
            -e Gateway__Modules__Path=/app/modules \
            -e Gateway__Modules__Enabled__0=lakehouse \
            "$IMAGE_REF_LOWER"

          ready=0
          for _ in $(seq 1 30); do
            code="$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/health/live || true)"
            if [ "$code" = "200" ]; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            docker logs autheris-module-e2e >&2 || true
            echo "Error: Container failed to become healthy on /health/live" >&2
            exit 1
          fi

          module_code="$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/modules/lakehouse/iceberg/v1/tenant-a/namespaces)"
          if [ "$module_code" != "401" ]; then
            docker logs autheris-module-e2e >&2 || true
            echo "Error: Expected HTTP 401 on /modules/lakehouse/iceberg/v1/tenant-a/namespaces, got $module_code" >&2
            exit 1
          fi

          legacy_ns_code="$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/v1/tenant-a/namespaces)"
          if [ "$legacy_ns_code" != "404" ]; then
            echo "Error: Expected HTTP 404 on /v1/tenant-a/namespaces, got $legacy_ns_code" >&2
            exit 1
          fi

          legacy_cfg_code="$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/v1/config)"
          if [ "$legacy_cfg_code" != "404" ]; then
            echo "Error: Expected HTTP 404 on /v1/config, got $legacy_cfg_code" >&2
            exit 1
          fi
