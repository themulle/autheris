name: Build & Push Getting-Started Container

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image Tag (z. B. getting-started, v1.0.0, latest)'
        required: true
        default: 'getting-started'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Container to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Autheris
        run: |
          dotnet publish src/Autheris.Api/Autheris.Api.csproj \
            -c Release \
            -o ./dist/publish

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        id: repo-name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.repo-name.outputs.IMAGE_NAME }}:getting-started
            ${{ steps.repo-name.outputs.IMAGE_NAME }}:latest
            ${{ github.event.inputs.tag && format('{0}:{1}', steps.repo-name.outputs.IMAGE_NAME, github.event.inputs.tag) || '' }}
