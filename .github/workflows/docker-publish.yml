name: Build & Push Getting-Started Container

on:
  push:
    tags: [ 'v*' ]
  workflow_run:
    workflows: [ "CI Build & Test" ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image Tag (z. B. getting-started, v1.0.0, latest)'
        required: true
        default: 'getting-started'

permissions: {}

jobs:
  build-and-push:
    name: Build, Scan & Push Container to GHCR
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore with Locked Mode
        run: dotnet restore Autheris.sln --locked-mode

      - name: Vulnerable Package Audit
        run: |
          dotnet list Autheris.sln package --vulnerable --include-transitive --format json --output-version 1 > vulnerable.json
          jq -e '[.projects[].frameworks[]? | (.topLevelPackages // []) + (.transitivePackages // []) | .[]] | length == 0' vulnerable.json \
            || { echo "::error::Vulnerable NuGet packages detected"; jq . vulnerable.json; exit 1; }

      - name: Run Test Suite
        run: dotnet test Autheris.sln -c Release --no-restore --verbosity normal

      - name: Publish Autheris
        run: |
          dotnet publish src/Autheris.Api/Autheris.Api.csproj \
            -c Release \
            --no-restore \
            -p:AutherisIncludeTestAuth=false \
            -o ./dist/publish

      - name: Verify TestAuthHandler is Excluded from Publish Output (SC-04)
        run: |
          if strings ./dist/publish/Autheris.Api.dll | grep -E "(^TestAuth$|Autheris\.Api\.Security\.TestAuthHandler)" > /dev/null; then
            echo "::error::Security invariant violation: TestAuthHandler found in published binary!"
            exit 1
          fi
          echo "Verified: TestAuthHandler and TestAuth scheme are excluded from publish binary."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build local image for scanning
        id: build-local
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: autheris:scan

      - name: Trivy Container Vulnerability Scan (Gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: autheris:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy-results.sarif

      - name: Compute Docker Image Tags
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAGS=()
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [[ ! "$INPUT_TAG" =~ ^[a-zA-Z0-9_.-]+$ ]]; then
              echo "Error: Invalid docker tag '$INPUT_TAG'" >&2
              exit 1
            fi
            TAGS+=("${IMAGE}:${INPUT_TAG}")
            if [ "$INPUT_TAG" = "latest" ]; then
              TAGS+=("${IMAGE}:getting-started")
            fi
          elif [ "$REF_TYPE" = "tag" ]; then
            TAGS+=("${IMAGE}:${REF_NAME}")
            TAGS+=("${IMAGE}:latest")
            TAGS+=("${IMAGE}:getting-started")
          else
            # Push on main (workflow_run / push on main)
            # SC-01: No latest on main branch pushes
            TAGS+=("${IMAGE}:main")
            TAGS+=("${IMAGE}:sha-${COMMIT_SHA}")
          fi
          TAGS_STR=$(printf "%s\n" "${TAGS[@]}")
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "$TAGS_STR" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Supply-chain attestations (SLSA provenance + SPDX SBOM) attached to the image
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign by digest (keyless)
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE,,}@${DIGEST}"

      - name: Verify signature (self-check)
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign verify "${IMAGE,,}@${DIGEST}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/themulle/autheris/\.github/workflows/docker-publish\.yml@refs/(heads/main|tags/v.+)$'
          echo "Published digest: ${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
