version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      nuget:
        patterns: ["*"]
    ignore:
      # Packages that move with the target framework: a new major means .NET 11 and follows the upgrade plan only.
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Data.Sqlite*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # Dependabot names the images dotnet/sdk and dotnet/aspnet (the registry prefix is not part of the name).
      # The mcr.microsoft.com/... names stay for older Dependabot versions. Major .NET bumps follow the upgrade plan only.
      - dependency-name: "dotnet/sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet/aspnet"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet/runtime"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mcr.microsoft.com/dotnet/sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mcr.microsoft.com/dotnet/aspnet"
        update-types: ["version-update:semver-major"]

  # WP-OI-CI-1 (Q-CI-2): one weekly group per ecosystem for deploy and benchmarks.
  - package-ecosystem: "docker"
    directories:
      - "/deploy/containers/gqlgateway-api"
      - "/benchmarks/load/docker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      docker-deploy-benchmarks:
        patterns: ["*"]
    ignore:
      # Dependabot names the images dotnet/sdk and dotnet/aspnet (the registry prefix is not part of the name).
      # The mcr.microsoft.com/... names stay for older Dependabot versions. Major .NET bumps follow the upgrade plan only.
      - dependency-name: "dotnet/sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet/aspnet"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet/runtime"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mcr.microsoft.com/dotnet/sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mcr.microsoft.com/dotnet/aspnet"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # WP-OI-CI-1 (Q-CI-2): one weekly group per ecosystem for deploy and benchmarks.
  - package-ecosystem: "docker-compose"
    directories:
      - "/deploy"
      - "/benchmarks/load/docker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      compose-deploy-benchmarks:
        patterns: ["*"]

  # WP-OI-CI-1 (Q-CI-2): one weekly group per ecosystem for deploy and benchmarks.
  - package-ecosystem: "npm"
    directories:
      - "/benchmarks/load/configs/apollo-server"
      - "/benchmarks/load/configs/postgraphile"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-benchmarks:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/src/Autheris.Api/Assets/swagger-ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
