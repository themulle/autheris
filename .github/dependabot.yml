version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      nuget:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # WP-OI-CI-1 (Q-CI-2): one weekly group per ecosystem for deploy and benchmarks.
  - package-ecosystem: "docker"
    directories:
      - "/deploy/containers/gqlgateway-api"
      - "/benchmarks/load/docker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      docker-deploy-benchmarks:
        patterns: ["*"]

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # WP-OI-CI-1 (Q-CI-2): one weekly group per ecosystem for deploy and benchmarks.
  - package-ecosystem: "docker-compose"
    directories:
      - "/deploy"
      - "/benchmarks/load/docker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      compose-deploy-benchmarks:
        patterns: ["*"]

  # WP-OI-CI-1 (Q-CI-2): one weekly group per ecosystem for deploy and benchmarks.
  - package-ecosystem: "npm"
    directories:
      - "/benchmarks/load/configs/apollo-server"
      - "/benchmarks/load/configs/postgraphile"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-benchmarks:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/src/Autheris.Api/Assets/swagger-ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
