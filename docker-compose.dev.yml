# ==============================================================================
# Autheris - Getting-Started / Development Override
#
# !!! FOR LOCAL DEVELOPMENT / DEMOS ONLY - NEVER USE IN PRODUCTION !!!
# Development disables core security controls (test auth, demo data,
# developer secrets, verbose error details, no HSTS/HTTPS redirect).
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Ports in docker-compose.yml are bound to 127.0.0.1. DO NOT rebind to 0.0.0.0
# or a public interface: Development provisions dev users (e.g. dev-admin with
# ClusterAdmin) without real authentication.
#
# SEC C-04: Running Development inside a container requires explicit opt-in via
# AUTHERIS_ALLOW_DEV_IN_CONTAINER=true, otherwise the gateway aborts startup.
# ==============================================================================
services:
  gql-gateway:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - AUTHERIS_ALLOW_DEV_IN_CONTAINER=true
